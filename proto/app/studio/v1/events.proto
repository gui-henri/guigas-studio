syntax = "proto3";

package app.studio.v1;

option go_package = "github.com/gui-henri/guigas-studio/backend/gen/app/studio/v1;studiov1";

// VideoStatusChanged is emitted whenever a video moves through the machine.
message VideoStatusChanged {
  string video_id = 1;
  string slug = 2;
  string from_status = 3;
  string to_status = 4;
}

// ScriptValidated is emitted by the artifact observer (valid or not).
message ScriptValidated {
  string video_id = 1;
  string slug = 2;
  bool valid = 3;
}

// WatcherPostFound announces a brand-new post detected by the RSS watcher.
message WatcherPostFound {
  string slug = 1;
}

// ScenesValidated is emitted after scene grammar validation (valid or not).
// Rejected carries the workspace path of .validation-latest.json.
message ScenesValidated {
  string video_id = 1;
  string slug = 2;
  bool valid = 3;
}

// JobProgress mirrors render progress to the dashboard in real time.
message JobProgress {
  string job_id = 1;
  string video_id = 2;
  int32 percent = 3;
  string stage = 4;
}

// StudioEvent is the typed envelope shared Go↔TS over SSE (protojson).
message StudioEvent {
  oneof event {
    VideoStatusChanged video_status_changed = 1;
    ScriptValidated script_validated = 2;
    WatcherPostFound watcher_post_found = 3;
    ScenesValidated scenes_validated = 4;
    JobProgress job_progress = 5;
  }
}
