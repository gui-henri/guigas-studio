syntax = "proto3";

package app.studio.v1;

option go_package = "github.com/gui-henri/guigas-studio/backend/gen/app/studio/v1;studiov1";

import "app/studio/v1/script.proto";

// VideoStatus mirrors the canonical pipeline state machine (ROADMAP.md).
// Never rename an existing value; append new states at the end.
enum VideoStatus {
  VIDEO_STATUS_UNSPECIFIED = 0;
  VIDEO_STATUS_NEW = 1;
  VIDEO_STATUS_SCRIPT_PENDING = 2;
  VIDEO_STATUS_SCRIPT_REVIEW = 3;
  VIDEO_STATUS_SCRIPT_APPROVED = 4;
  VIDEO_STATUS_RECORDING = 5;
  VIDEO_STATUS_VOICE_PROCESSING = 6;
  VIDEO_STATUS_SCENES_PENDING = 7;
  VIDEO_STATUS_SCENES_REVIEW = 8;
  VIDEO_STATUS_QUEUED = 9;
  VIDEO_STATUS_RENDERING = 10;
  VIDEO_STATUS_FINAL_REVIEW = 11;
  VIDEO_STATUS_RELEASED = 12;
  VIDEO_STATUS_BLOCKED = 13;
}

// Video is the pipeline index entry kept in Postgres (D-02); heavy artifacts live on disk.
message Video {
  string id = 1;
  string slug = 2;
  string title = 3;
  string source_url = 4;
  VideoStatus status = 5;
  string created_at = 6;
  string updated_at = 7;
}

// VideoArtifacts reports which workspace artifacts already exist on disk.
message VideoArtifacts {
  bool script = 1;
  bool audio = 2;
  bool timelines = 3;
  bool renders = 4;
}

// StatusChange is one entry of the audited state history.
message StatusChange {
  string status = 1;
  string reason = 2;
  string actor = 3;
  string changed_at = 4;
}

message ListVideosRequest {}

message ListVideosResponse {
  repeated Video videos = 1;
}

message GetVideoRequest {
  string id = 1;
}

message GetVideoResponse {
  Video video = 1;
  // Parsed current script (present when script.json exists and validates).
  StudioScript script = 2;
  // First successfully validated version — diff base for the review UI (S1-06).
  StudioScript original_script = 3;
  VideoArtifacts artifacts = 4;
  repeated StatusChange status_history = 5;
}

message CreateVideoRequest {
  string slug = 1;
  string title = 2;
  string source_url = 3;
}

message CreateVideoResponse {
  Video video = 1;
}

message UpdateScriptRequest {
  string video_id = 1;
  StudioScript script = 2;
}

message UpdateScriptResponse {
  // Validation errors; empty when the script was accepted and written.
  repeated string errors = 1;
  StudioScript script = 2;
}

message ApproveScriptRequest {
  string video_id = 1;
}

message ApproveScriptResponse {
  Video video = 1;
}

message RejectScriptRequest {
  string video_id = 1;
  string comment = 2;
}

message RejectScriptResponse {
  Video video = 1;
}

// TakeSummary is one recorded artifact pair entry for a video.
message TakeSummary {
  string segment_id = 1;
  string kind = 2; // audio | blendshapes
  string sha256 = 3;
  int64 size_bytes = 4;
  string created_at = 5;
}

message ListTakesRequest {
  string video_slug = 1;
}

message ListTakesResponse {
  repeated TakeSummary takes = 1;
}

// VideoService manages the video index of the Studio.
service VideoService {
  rpc ListVideos(ListVideosRequest) returns (ListVideosResponse);
  rpc GetVideo(GetVideoRequest) returns (GetVideoResponse);
  rpc CreateVideo(CreateVideoRequest) returns (CreateVideoResponse);
  rpc UpdateScript(UpdateScriptRequest) returns (UpdateScriptResponse);
  rpc ApproveScript(ApproveScriptRequest) returns (ApproveScriptResponse);
  rpc RejectScript(RejectScriptRequest) returns (RejectScriptResponse);
  rpc ListTakes(ListTakesRequest) returns (ListTakesResponse);
  rpc ApproveScenes(ApproveScenesRequest) returns (ApproveScenesResponse);
  rpc RequestRerender(RequestRerenderRequest) returns (RequestRerenderResponse);
  rpc ApproveFinalCut(ApproveFinalCutRequest) returns (ApproveFinalCutResponse);
}

message RequestRerenderRequest {
  string video_id = 1;
}

message RequestRerenderResponse {
  Video video = 1;
}

message ApproveFinalCutRequest {
  string video_id = 1;
}

message ApproveFinalCutResponse {
  Video video = 1;
}

message ApproveScenesRequest {
  string video_id = 1;
}

message ApproveScenesResponse {
  Video video = 1;
}
